# Quartier Coop : met à jour toutes les 3 heures le fichier horaires.json (passages prévus aux arrêts du quartier).
name: Mise à jour des horaires
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  horaires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calculer les passages
        run: python scripts/horaires.py
      - name: Enregistrer le résultat
        run: |
          git config user.name "horaires-bot"
          git config user.email "horaires-bot@users.noreply.github.com"
          git add horaires.json
          git diff --staged --quiet || (git commit -m "Mise à jour des horaires" && git push)
